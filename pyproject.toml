[project]
name = "systemfactory"
version = "0.1.0"
description = "Local AI-assisted software engineering workflow: intake -> triage -> PRD -> plan -> code -> test -> review -> human approval."
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
claude = ["anthropic"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["demo", "data", ".git", "scripts"]
markers = ["ollama: needs a running Ollama server with the configured models (skipped by default)"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "B"]
ignore = ["E501"]  # long lines are a style choice here; everything else is enforced in CI

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true
check_untyped_defs = true

[tool.coverage.run]
source = ["systemfactory", "evaluation"]
branch = true

[tool.coverage.report]
show_missing = false
skip_covered = false
