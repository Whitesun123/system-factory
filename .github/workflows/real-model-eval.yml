name: real-model evaluation (manual, trusted runner only)
# Runs real local inference. Deliberately NOT triggered by push or pull_request, and it uses no secrets.
# This file alone cannot keep pull-request code off a self-hosted runner: any workflow that names the runner's labels
# can target it. This repository is public, so do NOT register a `gpu-ollama` runner on it unless (a) the runner is in
# a runner group restricted to this workflow on refs/heads/main, (b) workflows from outside contributors require
# approval, and preferably (c) the runner is ephemeral. No such runner is registered today.
# Requires Ollama, the models and the sandbox image already installed on the runner.
on:
  workflow_dispatch:
    inputs:
      configs:
        description: "reviewer configs (role=model, comma separated)"
        default: "ollama-a=phi4:14b,ollama-b=qwen3:14b"
      budget_minutes:
        description: "cumulative inference budget"
        default: "30"
permissions:
  contents: read
jobs:
  evaluate:
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, gpu-ollama]
    timeout-minutes: 120
    defaults:
      run:
        shell: bash   # Git Bash on a Windows runner
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: python -m pip install -r requirements.txt -c constraints.txt
      - run: python scripts/check_models.py
      # inputs reach the shell only as environment variables, never interpolated into the script
      - env:
          CONFIGS: ${{ inputs.configs }}
          BUDGET: ${{ inputs.budget_minutes }}
        run: python -m evaluation.run --configs "$CONFIGS" --budget-minutes "$BUDGET" --execution docker
      - uses: actions/upload-artifact@v4
        with:
          name: reviewer-evaluation
          path: evaluation/results/report.json
